name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否打 tag 并发布 Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------- 准备
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来生成变更日志

      - name: 读取版本号 (version.json)
        id: ver
        run: |
          set -e
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('version.json'))['versionName'])")
          VERSION_CODE=$(python3 -c "import json;print(json.load(open('version.json'))['versionCode'])")
          STAGE=$(python3 -c "import json;print(json.load(open('version.json')).get('stage','') or '')")
          if [ -n "$STAGE" ]; then TAG="v${VERSION_NAME}-${STAGE}"; else TAG="v${VERSION_NAME}"; fi
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
            echo "stage=$STAGE"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION_NAME ($VERSION_CODE)  标签: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ---------------------------------------------------------- 固定签名
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64 —— 请在 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coursewidget.p12"
          echo "密钥已还原,大小: $(stat -c%s "$RUNNER_TEMP/coursewidget.p12") 字节"
          # 确认是 PKCS#12(开头应为 30 82)
          od -An -tx1 -N2 "$RUNNER_TEMP/coursewidget.p12"

      # ---------------------------------------------------------- 构建
      # 口令由 shell 从 Secret 展开后作为 -P 传入,脚本里不存在明文口令,
      # 因此构建失败时也不会把关口打印到日志。
      - name: 构建 release APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEY_ALIAS" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少 Secret KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 之一"
            exit 1
          fi
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -Psigning.storeFile="$RUNNER_TEMP/coursewidget.p12" \
            -Psigning.storePassword="$KS_PASS" \
            -Psigning.keyAlias="$KEY_ALIAS" \
            -Psigning.keyPassword="$KEY_PASS"

      - name: 整理产物
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CourseWidget-${{ steps.ver.outputs.tag }}.apk"
          ls -lh dist/

      - name: 校验签名
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$BT" verify --print-certs "dist/CourseWidget-${{ steps.ver.outputs.tag }}.apk" | head -20

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: CourseWidget-${{ steps.ver.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------- 变更日志
      - name: 生成变更日志
        if: github.event_name == 'push' || inputs.create_release
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then RANGE="HEAD"; else RANGE="$PREV..HEAD"; fi
          {
            echo "## CourseWidget ${{ steps.ver.outputs.tag }}"
            echo ""
            python3 -c "import json;d=json.load(open('version.json'));print(d.get('notes') or '_未填写说明_')"
            echo ""
            echo "### 本次变更"
            git log $RANGE --no-merges --pretty=format:'- %s (%h)' | head -40
            echo ""
            echo ""
            echo "### 安装说明"
            echo "1. 下载下面的 APK"
            echo "2. 手机安装(首次需允许安装未知来源应用)"
            echo "3. 打开 App 授予日历权限 → 桌面添加小组件 → 勾选课表日历"
            echo ""
            echo "> 自 0.1.0 起使用固定签名,后续版本可直接覆盖安装,无需卸载。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # ---------------------------------------------------------- 发布
      - name: 打 tag 并发布 Release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG 已存在,跳过发布。要重发请先删除该 tag 和 Release,或在 version.json 里升版本号"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "CourseWidget $TAG"
          git push origin "$TAG"
          ARGS=""
          if [ "${{ steps.ver.outputs.stage }}" = "beta" ]; then ARGS="--prerelease"; fi
          gh release create "$TAG" dist/*.apk \
            --title "CourseWidget $TAG" \
            --notes-file RELEASE_NOTES.md \
            $ARGS

      # ---------------------------------------------------------- 回写 README
      # 脚本用 base64 承载:避免 YAML 缩进与 heredoc 顶格要求互相冲突。
      - name: 更新 README 最新版本
        if: github.event_name == 'push' || inputs.create_release
        run: |
          set -e
          echo '' | base64 -d > /tmp/update_readme.py
          python3 /tmp/update_readme.py "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.stage || 'stable' }}"
          if git diff --quiet README.md; then
            echo "README 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 更新最新版本到 ${{ steps.ver.outputs.tag }} [skip ci]"
          git push
